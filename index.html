<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#eef6fa" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="澄みの灯" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" type="image/svg+xml" href="./icons/app-icon.svg" />
  <link rel="apple-touch-icon" href="./icons/suminohi-icon-180.png" />
  <title>澄みの灯</title>
  <style>
    :root{
      --bg1:#f7e6ef;
      --bg2:#dff3f0;
      --card:rgba(255,255,255,0.55);
      --line:rgba(0,0,0,0.12);
      --text:#2a2a2a;
      --muted:rgba(0,0,0,0.55);
    }

    *{
      box-sizing:border-box;
      font-family:
        "Hiragino Maru Gothic ProN",
        "Hiragino Maru Gothic Pro",
        "Hiragino Sans",
        "Yu Gothic",
        "Meiryo",
        system-ui,
        -apple-system,
        "Segoe UI",
        sans-serif;
    }

    body{
      margin:0;
      color:var(--text);
      background:
        radial-gradient(1200px 600px at 15% 20%, var(--bg1), transparent 60%),
        radial-gradient(1200px 600px at 85% 80%, var(--bg2), transparent 60%),
        linear-gradient(135deg, #f8f3ff, #f2fff9);
      min-height:100vh;
      overflow-x:hidden;
    }

    input, button, select, textarea{
      font: inherit;
    }

    .wrap{
      width:min(100%, 720px);
      margin: 0 auto;
      padding:
        calc(14px + env(safe-area-inset-top))
        calc(16px + env(safe-area-inset-right))
        calc(42px + env(safe-area-inset-bottom))
        calc(16px + env(safe-area-inset-left));
    }

    .heroTop{
      display:flex;
      justify-content:space-between;
      align-items:flex-start;
      gap:10px;
    }

    .heroActions{
      display:flex;
      justify-content:flex-end;
      align-items:center;
      gap:8px;
      flex: 0 0 auto;
    }

    .iconBtn{
      width:44px;
      height:44px;
      border-radius: 14px;
      border:1px solid var(--line);
      background: rgba(255,255,255,0.72);
      box-shadow: 0 8px 20px rgba(0,0,0,0.05);
      font-size: 22px;
      cursor:pointer;
      line-height: 1;
      display:flex;
      align-items:center;
      justify-content:center;
      flex: 0 0 auto;
    }

    .refreshIconBtn{
      border-color: rgba(18,112,145,0.22);
      background: linear-gradient(135deg, rgba(168,231,255,0.75), rgba(214,250,255,0.9));
      box-shadow: 0 8px 20px rgba(15,89,120,0.12);
    }

    .editIconBtn{
      border-color: rgba(255,106,162,0.24);
      background: linear-gradient(135deg, rgba(255,181,218,0.9), rgba(255,216,236,0.95));
      box-shadow: 0 8px 20px rgba(255,106,162,0.16);
    }

    .hero{
      background: var(--card);
      border:1px solid var(--line);
      border-radius: 18px;
      padding: 18px 18px 14px;
      backdrop-filter: blur(10px);
      box-shadow: 0 10px 40px rgba(0,0,0,0.06);
    }

    h1{
      margin:0 0 8px;
      font-size: 30px;
      letter-spacing: .02em;
      font-weight: 800;
      min-width:0;
    }

    .sub{
      margin:0;
      color:var(--muted);
      font-weight: 700;
    }

    .panel{
      margin-top: 16px;
      background: var(--card);
      border:1px solid var(--line);
      border-radius: 18px;
      padding: 16px;
      backdrop-filter: blur(10px);
      box-shadow: 0 10px 40px rgba(0,0,0,0.06);
    }

    .grid{
      display:grid;
      gap:10px;
    }

    label{
      font-size: 12px;
      color: var(--muted);
      font-weight: 700;
      margin-left: 6px;
    }

    .row{
      display:grid;
      grid-template-columns: 1fr;
      gap:10px;
    }

    .row > div{
      min-width:0;
    }

    input{
      width:100%;
      padding: 14px 14px;
      border-radius: 14px;
      border:1px solid var(--line);
      background: rgba(255,255,255,0.7);
      outline:none;
      font-size: 16px;
      font-weight: 600;
    }

    input::placeholder{
      color: rgba(0,0,0,0.35);
      font-weight:600;
    }

    .btn{
      width:100%;
      padding: 14px 16px;
      border-radius: 16px;
      border:1px solid var(--line);
      background: rgba(255,255,255,0.6);
      font-weight: 800;
      font-size: 16px;
      cursor:pointer;
    }

    .btnPrimary{
      background: linear-gradient(135deg, rgba(255,106,162,0.95), rgba(255,197,220,0.95));
      border: 0;
      color: white;
      box-shadow: 0 12px 30px rgba(255,106,162,0.25);
    }

    .btnReset{
      background: rgba(94,200,255,0.18);
      color: #136a8a;
      font-weight: 800;
    }

    .note{
      margin: 10px 4px 0;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.5;
      font-weight: 600;
    }

    .list{
      display:grid;
      gap: 10px;
      margin-top: 14px;
    }

    .yearHeader{
      margin: 14px 2px 2px;
      display: flex;
      align-items: baseline;
      justify-content: flex-start;
      gap: 2em;
      font-weight: 900;
      color: rgba(0,0,0,0.7);
      letter-spacing: .03em;
    }

    .yearTotal{
      color: rgba(86,159,166,0.92);
      font-size: 14px;
      font-weight: 800;
      letter-spacing: 0;
    }

    .totalHabits{
      color: #ff5f9f;
      font-size: 22px;
      font-weight: 900;
      letter-spacing: 0;
      margin-left: auto;
      white-space: nowrap;
    }

    .habitItem{
      background: linear-gradient(135deg,
        rgba(63, 206, 194, 0.25),
        rgba(255,255,255,0.15)
      );
      border:1px solid var(--line);
      border-radius: 18px;
      padding: 12px;
      backdrop-filter: blur(10px);
    }

    .habitRow{
      display:grid;
      grid-template-columns: auto minmax(0, 1fr) 152px 32px;
      align-items:center;
      gap: 8px;
    }

    .datePill{
      padding: 6px 8px;
      border-radius: 999px;
      border: 1px dashed rgba(0,0,0,0.18);
      background: rgba(255,246,166,0.90);
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
      min-width: 58px;
      text-align:center;
      color: #e68e00;
      font-size: 16px;
      font-weight: 700;
      flex: 0 0 auto;
    }

    .datePillButton{
      position: relative;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .dateEditor{
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      margin: 0;
      opacity: 0;
      cursor: pointer;
      border: 0;
      padding: 0;
      z-index: 2;
    }

    .dateEditor::-webkit-calendar-picker-indicator{
      width: 100%;
      height: 100%;
      margin: 0;
      cursor: pointer;
    }

    .habitName{
      min-width:0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      color:#000;
      font-size: 16px;
      font-weight: 700;
    }

    .dayCount{
      display:inline-flex;
      align-items:baseline;
      justify-content:flex-start;
      gap: 2px;
      width: 100%;
      white-space: nowrap;
      font-variant-numeric: tabular-nums;
      color: #1445cb;
      font-size: 15px;
      font-weight: 700;
    }

    .dayCountNum{
      display:inline-block;
      width: 4ch;
      text-align:right;
      font-variant-numeric: tabular-nums;
    }

    .dayCountLabel{
      display:inline-block;
    }

    .deleteSquare{
      width: 32px;
      height: 32px;
      border-radius: 12px;
      border: 1px solid rgba(0,0,0,0.14);
      background: rgba(243, 142, 142, 0.6);
      font-size: 18px;
      line-height: 1;
      cursor: pointer;
      font-weight: 900;
      color: rgba(73, 17, 17, 0.6);
    }

    .deleteSquare:active{
      transform: scale(0.98);
    }

    .empty{
      border: 2px dashed rgba(0,0,0,0.12);
      border-radius: 18px;
      padding: 18px 14px;
      color: rgba(0,0,0,0.55);
      font-weight: 800;
      background: rgba(255,255,255,0.35);
    }

    .toast{
      margin-top: 10px;
      padding: 10px 12px;
      border-radius: 14px;
      background: rgba(0,0,0,0.06);
      color: rgba(0,0,0,0.65);
      font-weight: 700;
      font-size: 13px;
      display:none;
    }

    .toast.show{
      display:block;
    }

    .modal{
      position: fixed;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
      background: rgba(26, 20, 43, 0.35);
      z-index: 1000;
    }

    .modal.show{
      display:flex;
    }

    .modalCard{
      width:min(100%, 520px);
      background: rgba(255,255,255,0.95);
      border:1px solid var(--line);
      border-radius: 20px;
      padding: 14px;
      box-shadow: 0 18px 48px rgba(0,0,0,0.18);
      backdrop-filter: blur(12px);
    }

    .entryModalCard{
      width:min(100%, 760px);
    }

    .entryPanel{
      margin-top: 10px;
    }

    .modalHead{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:8px;
    }

    .modalTitle{
      margin:0;
      font-size: 18px;
      font-weight: 900;
    }

    .modalClose{
      width:38px;
      height:38px;
      border-radius: 12px;
      border:1px solid var(--line);
      background: rgba(255,255,255,0.8);
      font-size:22px;
      line-height:1;
      cursor:pointer;
    }

    .modalNote{
      margin: 8px 4px 10px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
      line-height: 1.5;
    }

    .backupText{
      width:100%;
      min-height: 130px;
      max-height: 300px;
      padding: 12px;
      border-radius: 14px;
      border:1px solid var(--line);
      background: rgba(255,255,255,0.82);
      resize: vertical;
      font-size: 13px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
    }

    .modalActions{
      display:grid;
      gap:8px;
      margin-top: 10px;
    }

    .btnBackupCreate{
      background: linear-gradient(135deg, rgba(255,210,128,0.92), rgba(255,238,174,0.92));
      border: 1px solid rgba(219,171,84,0.4);
      color:#8a5300;
    }

    .btnBackupRestore{
      background: linear-gradient(135deg, rgba(174,231,202,0.95), rgba(222,255,238,0.95));
      border: 1px solid rgba(102,173,134,0.45);
      color:#1d6c47;
    }

    @media (max-width: 430px){
      .wrap{
        padding:
          calc(12px + env(safe-area-inset-top))
          calc(10px + env(safe-area-inset-right))
          calc(32px + env(safe-area-inset-bottom))
          calc(10px + env(safe-area-inset-left));
      }

      h1{
        font-size: 26px;
      }

      .iconBtn{
        width:40px;
        height:40px;
      }

      .habitRow{
        grid-template-columns: auto minmax(0, 1fr) 128px 30px;
        gap: 6px;
      }

      .datePill{
        min-width: 52px;
        padding: 5px 6px;
        font-size: 14px;
      }

      .habitName{
        font-size: 15px;
      }

      .dayCount{
        font-size: 13px;
      }

      .dayCountNum{
        width: 3ch;
      }

      .deleteSquare{
        width:30px;
        height:30px;
        font-size:16px;
      }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="hero">
      <div class="heroTop">
        <h1>澄みの灯</h1>
        <div class="heroActions">
          <button id="editBtn" class="iconBtn editIconBtn" type="button" aria-label="習慣入力を開く">✏️</button>
          <button id="settingsBtn" class="iconBtn" type="button" aria-label="バックアップ設定を開く">⚙️</button>
          <button id="refreshBtn" class="iconBtn refreshIconBtn" type="button" aria-label="最新版に更新（キャッシュ削除）">🔄</button>
        </div>
      </div>
      <p class="sub">小さく始めて未来を育てる 🍃✨</p>
    </div>

    <div id="list" class="list"></div>
    <div id="toast" class="toast"></div>
  </div>

  <div id="backupModal" class="modal" aria-hidden="true">
    <div class="modalCard" role="dialog" aria-modal="true" aria-labelledby="backupTitle">
      <div class="modalHead">
        <h2 id="backupTitle" class="modalTitle">バックアップと復元</h2>
        <button id="closeModalBtn" class="modalClose" type="button" aria-label="閉じる">×</button>
      </div>
      <p class="modalNote">バックアップ文字列をメモアプリなどに保存しておくと、端末変更時に復元できます。</p>
      <label for="backupText">バックアップ文字列</label>
      <textarea id="backupText" class="backupText" placeholder="バックアップ文字列を作成するとここに表示されます。復元時はここに貼り付けてください。"></textarea>
      <div class="modalActions">
        <button id="createBackupBtn" class="btn btnBackupCreate" type="button">バックアップ文字列を作成</button>
        <button id="restoreBackupBtn" class="btn btnBackupRestore" type="button">バックアップ文字列を復元</button>
      </div>
    </div>
  </div>

  <div id="entryModal" class="modal" aria-hidden="true">
    <div class="modalCard entryModalCard" role="dialog" aria-modal="true" aria-labelledby="entryTitle">
      <div class="modalHead">
        <h2 id="entryTitle" class="modalTitle">習慣を追加</h2>
        <button id="closeEntryModalBtn" class="modalClose" type="button" aria-label="閉じる">×</button>
      </div>
      <div class="panel entryPanel">
        <div class="grid">
          <div>
            <label for="habitName">習慣名</label>
            <input id="habitName" type="text" placeholder="例: ヨガ / 読書30分 / ストレッチ" />
          </div>

          <div class="row">
            <div>
              <label for="startDate">開始日</label>
              <input id="startDate" type="date" />
            </div>
            <div>
              <label>&nbsp;</label>
              <button id="addBtn" class="btn btnPrimary" type="button">追加</button>
            </div>
          </div>

          <button id="resetBtn" class="btn btnReset" type="button">全データリセット</button>
          <div class="note">データはこの端末のブラウザに保存されます（localStorage）。</div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const STORAGE_KEY = "habitTracker_v2";
    const LEGACY_STORAGE_KEYS = ["habitTracker_v1", "habitTracker"];
    const $ = (id) => document.getElementById(id);

    function escapeHtml(str){
      return String(str)
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#39;");
    }

    function showToast(msg){
      const t = $("toast");
      t.textContent = msg;
      t.classList.add("show");
      clearTimeout(showToast._timer);
      showToast._timer = setTimeout(() => t.classList.remove("show"), 2200);
    }

    function toISODateString(d){
      const y = d.getFullYear();
      const m = String(d.getMonth() + 1).padStart(2, "0");
      const day = String(d.getDate()).padStart(2, "0");
      return `${y}-${m}-${day}`;
    }

    function formatMD(dateLike){
      const d = new Date(dateLike);
      const m = d.getMonth() + 1;
      const day = d.getDate();
      return `${m}/${day}`;
    }

    function getYear(dateLike){
      return new Date(dateLike).getFullYear();
    }

    function daysFromStart(dateLike){
      const start = new Date(dateLike);
      const today = new Date();
      const s = new Date(start.getFullYear(), start.getMonth(), start.getDate());
      const t = new Date(today.getFullYear(), today.getMonth(), today.getDate());
      return Math.floor((t - s) / 86400000) + 1;
    }

    // 30日を1か月として概算表示
    function monthDayFromStart(dateLike){
      const d = daysFromStart(dateLike);
      const months = Math.floor((d - 1) / 30);
      const days = ((d - 1) % 30) + 1;
      return { months, days };
    }

    function migrateLegacyData(){
      const currentRaw = localStorage.getItem(STORAGE_KEY);
      if(currentRaw !== null) return;

      for(const key of LEGACY_STORAGE_KEYS){
        const raw = localStorage.getItem(key);
        if(!raw) continue;

        try{
          const parsed = JSON.parse(raw);
          if(Array.isArray(parsed)){
            localStorage.setItem(STORAGE_KEY, JSON.stringify(parsed));
            return;
          }
        }catch{
          // 古いデータ形式が壊れていた場合はスキップ
        }
      }
    }

    function loadHabits(){
      try{
        const raw = localStorage.getItem(STORAGE_KEY);
        if(!raw) return [];
        const parsed = JSON.parse(raw);
        return Array.isArray(parsed) ? parsed : [];
      }catch{
        return [];
      }
    }

    function saveHabits(habits){
      localStorage.setItem(STORAGE_KEY, JSON.stringify(habits));
    }

    function makeId(){
      if(typeof crypto !== "undefined" && typeof crypto.randomUUID === "function"){
        return crypto.randomUUID();
      }
      return `${Date.now()}_${Math.random().toString(16).slice(2)}`;
    }

    function getAppStorageKeys(){
      const keys = new Set([STORAGE_KEY]);

      for(const legacyKey of LEGACY_STORAGE_KEYS){
        if(localStorage.getItem(legacyKey) !== null) keys.add(legacyKey);
      }

      for(let i = 0; i < localStorage.length; i++){
        const key = localStorage.key(i);
        if(!key) continue;
        if(key === STORAGE_KEY || key.startsWith("habitTracker_")){
          keys.add(key);
        }
      }

      return [...keys];
    }

    function utf8ToBase64(text){
      const bytes = new TextEncoder().encode(text);
      let binary = "";
      for(const b of bytes){
        binary += String.fromCharCode(b);
      }
      return btoa(binary);
    }

    function base64ToUtf8(base64){
      const binary = atob(base64);
      const bytes = Uint8Array.from(binary, (ch) => ch.charCodeAt(0));
      return new TextDecoder().decode(bytes);
    }

    function openBackupModal(){
      const modal = $("backupModal");
      modal.classList.add("show");
      modal.setAttribute("aria-hidden", "false");
    }

    function closeBackupModal(){
      const modal = $("backupModal");
      modal.classList.remove("show");
      modal.setAttribute("aria-hidden", "true");
    }

    function openEntryModal(){
      const modal = $("entryModal");
      modal.classList.add("show");
      modal.setAttribute("aria-hidden", "false");
      $("habitName").focus();
    }

    function closeEntryModal(){
      const modal = $("entryModal");
      modal.classList.remove("show");
      modal.setAttribute("aria-hidden", "true");
    }

    function createBackupString(){
      const keys = getAppStorageKeys();
      const entries = {};

      for(const key of keys){
        const value = localStorage.getItem(key);
        if(value !== null) entries[key] = value;
      }

      if(Object.keys(entries).length === 0){
        entries[STORAGE_KEY] = JSON.stringify([]);
      }

      const payload = {
        version: 1,
        app: "habit_last",
        savedAt: new Date().toISOString(),
        entries
      };

      const encoded = utf8ToBase64(JSON.stringify(payload));
      const textArea = $("backupText");
      textArea.value = encoded;
      textArea.focus();
      textArea.select();

      if(navigator.clipboard && navigator.clipboard.writeText){
        navigator.clipboard.writeText(encoded).catch(() => {
          // iOS SafariではクリップボードAPIが拒否されることがあるため、選択状態にするだけにする
        });
      }

      showToast("バックアップ文字列を作成しました");
    }

    function restoreBackupString(){
      const text = $("backupText").value.trim();
      if(!text){
        alert("バックアップ文字列を入力してください。");
        return;
      }

      if(!confirm("バックアップ文字列から復元します。現在のデータは上書きされます。よろしいですか？")) return;

      try{
        const decoded = base64ToUtf8(text);
        const payload = JSON.parse(decoded);

        if(!payload || typeof payload !== "object" || typeof payload.entries !== "object"){
          throw new Error("バックアップ形式が正しくありません。");
        }

        const targetKeys = new Set([...getAppStorageKeys(), ...Object.keys(payload.entries)]);
        for(const key of targetKeys){
          if(key === STORAGE_KEY || key.startsWith("habitTracker_") || LEGACY_STORAGE_KEYS.includes(key)){
            localStorage.removeItem(key);
          }
        }

        for(const [key, value] of Object.entries(payload.entries)){
          if(!(key === STORAGE_KEY || key.startsWith("habitTracker_") || LEGACY_STORAGE_KEYS.includes(key))) continue;
          if(typeof value !== "string"){
            throw new Error(`キー ${key} の値が不正です。`);
          }
          localStorage.setItem(key, value);
        }

        migrateLegacyData();
        render();
        closeBackupModal();
        alert("バックアップから復元しました。");
      }catch(error){
        alert(`復元に失敗しました。文字列を確認してください。\n${error.message || "不明なエラー"}`);
      }
    }

    async function refreshLatestWithCacheClear(){
      const ok = confirm("キャッシュを削除して最新版を読み込みます。入力データは消えません。実行しますか？");
      if(!ok) return;

      try{
        // iOS Safari/PWAでは対応APIが環境差で使えないことがあるため、使える処理だけ実行する
        if("serviceWorker" in navigator){
          const registrations = await navigator.serviceWorker.getRegistrations();
          await Promise.all(registrations.map((reg) => reg.unregister()));
        }

        if("caches" in window){
          const cacheKeys = await caches.keys();
          await Promise.all(cacheKeys.map((key) => caches.delete(key)));
        }

        alert("キャッシュを削除しました。最新版を読み込みます。");
        location.reload();
      }catch(error){
        console.error(error);
        alert("キャッシュ削除中にエラーが発生しました。Safariを再起動して再度お試しください。");
      }
    }

    function render(){
      const listEl = $("list");
      const habits = loadHabits();
      listEl.innerHTML = "";

      if(habits.length === 0){
        listEl.innerHTML = "<div class=\"empty\">まだ習慣がありません。上のフォームから追加して、継続を育てましょう。</div>";
        return;
      }

      const sorted = [...habits].sort((a, b) => {
        const d = new Date(a.startDate) - new Date(b.startDate);
        if(d !== 0) return d;
        return String(a.name).localeCompare(String(b.name), "ja");
      });
      const yearCounts = habits.reduce((counts, habit) => {
        const year = getYear(habit.startDate);
        counts[year] = (counts[year] ?? 0) + 1;
        return counts;
      }, {});

      let currentYear = null;

      for(const h of sorted){
        const y = getYear(h.startDate);
        if(y !== currentYear){
          currentYear = y;
          const yEl = document.createElement("div");
          yEl.className = "yearHeader";
          const yearLabelEl = document.createElement("span");
          yearLabelEl.textContent = `${currentYear}年`;
          const yearTotalEl = document.createElement("span");
          yearTotalEl.className = "yearTotal";
          yearTotalEl.textContent = `${yearCounts[currentYear]}habit`;
          yEl.append(yearLabelEl, yearTotalEl);
          if(currentYear === 2025){
            const totalHabitsEl = document.createElement("span");
            totalHabitsEl.className = "totalHabits";
            totalHabitsEl.textContent = `Total ${habits.length}habit`;
            yEl.appendChild(totalHabitsEl);
          }
          listEl.appendChild(yEl);
        }

        const item = document.createElement("div");
        item.className = "habitItem";

        const d = daysFromStart(h.startDate);
        const { months, days } = monthDayFromStart(h.startDate);
        const dayText = d >= 1
          ? `<span class="dayCountNum">${d}</span><span class="dayCountLabel">日目(${months}ヶ月${days}日)</span>`
          : `<span class="dayCountLabel">未開始</span>`;

        item.innerHTML = `
          <div class="habitRow">
            <label class="datePillButton" aria-label="開始日を変更">
              <span class="datePill">${formatMD(h.startDate)}</span>
              <input
                class="dateEditor"
                type="date"
                value="${escapeHtml(h.startDate)}"
                data-id="${escapeHtml(h.id)}"
                aria-label="開始日を選択"
              />
            </label>
            <span class="habitName">${escapeHtml(h.name)}</span>
            <span class="dayCount">${dayText}</span>
            <button class="deleteSquare" aria-label="削除" data-id="${h.id}">×</button>
          </div>
        `;

        listEl.appendChild(item);
      }

      listEl.querySelectorAll(".deleteSquare").forEach((btn) => {
        btn.addEventListener("click", () => {
          const id = btn.dataset.id;
          deleteHabit(id);
        });
      });

      listEl.querySelectorAll(".dateEditor").forEach((input) => {
        input.addEventListener("change", () => {
          updateHabitStartDate(input.dataset.id, input.value);
        });
      });
    }

    function addHabit(){
      const name = $("habitName").value.trim();
      const start = $("startDate").value;

      if(!name){
        showToast("習慣名を入力してください");
        return;
      }
      if(!start){
        showToast("開始日を選択してください");
        return;
      }

      const todayISO = toISODateString(new Date());
      if(start > todayISO){
        showToast("未来日は指定できません。開始日を確認してください。");
        return;
      }

      const habits = loadHabits();
      habits.push({ id: makeId(), name, startDate: start });
      saveHabits(habits);

      $("habitName").value = "";
      showToast("追加しました");
      render();
      closeEntryModal();
    }

    function deleteHabit(id){
      const habits = loadHabits();
      saveHabits(habits.filter((h) => h.id !== id));
      showToast("削除しました");
      render();
    }

    function updateHabitStartDate(id, startDate){
      if(!id || !startDate) return;

      const todayISO = toISODateString(new Date());
      if(startDate > todayISO){
        showToast("未来日は指定できません。開始日を確認してください。");
        render();
        return;
      }

      const habits = loadHabits();
      const idx = habits.findIndex((h) => h.id === id);
      if(idx < 0) return;

      habits[idx] = { ...habits[idx], startDate };
      saveHabits(habits);
      showToast("開始日を更新しました");
      render();
    }

    function resetAll(){
      if(!confirm("全データをリセットします。よろしいですか？")) return;
      localStorage.removeItem(STORAGE_KEY);
      showToast("リセットしました");
      render();
    }

    function init(){
      migrateLegacyData();

      $("addBtn").addEventListener("click", addHabit);
      $("resetBtn").addEventListener("click", resetAll);
      $("editBtn").addEventListener("click", openEntryModal);
      $("refreshBtn").addEventListener("click", refreshLatestWithCacheClear);
      $("settingsBtn").addEventListener("click", openBackupModal);
      $("closeModalBtn").addEventListener("click", closeBackupModal);
      $("closeEntryModalBtn").addEventListener("click", closeEntryModal);
      $("createBackupBtn").addEventListener("click", createBackupString);
      $("restoreBackupBtn").addEventListener("click", restoreBackupString);

      $("habitName").addEventListener("keydown", (e) => {
        if(e.key === "Enter") addHabit();
      });

      $("backupModal").addEventListener("click", (e) => {
        if(e.target.id === "backupModal") closeBackupModal();
      });

      $("entryModal").addEventListener("click", (e) => {
        if(e.target.id === "entryModal") closeEntryModal();
      });

      document.addEventListener("keydown", (e) => {
        if(e.key === "Escape"){
          closeBackupModal();
          closeEntryModal();
        }
      });

      if(!$("startDate").value){
        $("startDate").value = toISODateString(new Date());
      }

      render();
    }

    if("serviceWorker" in navigator){
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("./sw.js").catch((error) => {
          console.error("Service Worker registration failed:", error);
        });
      });
    }

    init();
  </script>
</body>
</html>
